# Codemagic configuration — iOS builds for the Flutter laundry customer app.
#
# Repo layout: the monorepo root contains this file; the Flutter app lives in
# the APP/ subdirectory. Codemagic reads THIS file directly from the repo root.
#
# IMPORTANT: The repo also ships an untouched macos/Runner.xcodeproj (Flutter
# default desktop project). It must NOT be code-signed here, so every signing
# step explicitly scopes itself to the iOS project only:
#   xcode-project use-profiles --project ios/Runner.xcodeproj --archive-method app-store
#
# One-time setup in the Codemagic UI:
#   1. Connect this Git repository (GitHub: github.com/qaisamro/E-clean) to
#      Codemagic (Application settings > Integration) and select the Flutter
#      app (APP/). Codemagic auto-detects this codemagic.yaml.
#   2. Create an App Store Connect API key in Apple Developer (Users & Access
#      > Keys > App Store Connect API). Role: Admin (required to create
#      certificates and distribution profiles automatically).
#   3. Codemagic > Team settings > Environment variables > global:
#      add a GROUP named  app_store_connect  with:
#        APP_STORE_CONNECT_PRIVATE_KEY    = contents of the .p8 file (BEGIN/END lines)
#        APP_STORE_CONNECT_KEY_IDENTIFIER = e.g. 3MD9688D9K
#        APP_STORE_CONNECT_ISSUER_ID      = e.g. 21d78e2f-b8ad-....
#   4. Apple Developer account must stay active ($99/year) and the App Store
#      Connect portal must contain the app (Bundle ID: com.elitecleanps.laundry).
#   5. In App Store Connect > App Store > version 1.0.7 > select the uploaded
#      build and submit for review; before that, configure screenshots and
#      "App Review" sign-in notes in the Apple Developer console.

workflows:
  ios-production:
    name: iOS Production (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: APP
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_connect
      vars:
        BUNDLE_ID: com.elitecleanps.laundry
        APP_DISPLAY_NAME: Elite Cleaning
    scripts:
      - name: Install Flutter dependencies
        script: |
          set -e
          flutter pub get

      - name: Set up iOS code signing (automatic)
        script: |
          set -e
          echo "APP_STORE_CONNECT_KEY_IDENTIFIER: ${APP_STORE_CONNECT_KEY_IDENTIFIER:-MISSING}"
          echo "APP_STORE_CONNECT_ISSUER_ID: ${APP_STORE_CONNECT_ISSUER_ID:-MISSING}"
          echo "APP_STORE_CONNECT_PRIVATE_KEY: $([ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && echo "set (${#APP_STORE_CONNECT_PRIVATE_KEY} chars)" || echo MISSING)"

          # Fresh keychain so stale certificates cannot confuse the import.
          keychain initialize

          # Looks up the distribution certificate + App Store provisioning
          # profile for $BUNDLE_ID; creates them if they don't exist.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create

          # Imports the distribution certificate (.p12) into the keychain.
          # If this emits a SecKeychainItemImport warning, the certificate
          # identity may not be usable by codesign — the find-identity step
          # below fails loudly in that case.
          keychain add-certificates

          # Fail early if the private key for the distribution certificate
          # is NOT usable by codesign. Prints the available identities.
          echo "Codesigning identities available:"
          security find-identity -v -p codesigning || true
          codesign_identity=$(security find-identity -v -p codesigning | grep -E -i 'iPhone Distribution|Apple Distribution' | head -n1 || true)
          if [ -z "$codesign_identity" ]; then
            echo "ERROR: no usable Apple Distribution identity in the keychain — check the SecKeychainItemImport warning above (certificate password/private key problem)."
            exit 1
          fi
          echo "Using identity: $codesign_identity"

          # CRITICAL: scope signing to the iOS project only.
          # Without --project, this also matches macos/Runner.xcodeproj and
          # fails with "Failed to set code signing settings for macos/Runner.xcodeproj".
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store
          echo "Manual signing configured for $BUNDLE_ID"

      - name: Build signed IPA
        script: |
          set -e
          # Keep iOS version/build in sync with Android: versionCode 13.
          echo "CFBundleShortVersionString: 1.0.7 | CFBundleVersion: 13"
          flutter build ipa \
            --release \
            --export-method app-store \
            --build-name 1.0.7 \
            --build-number 13

      - name: Verify IPA artifact exists
        script: |
          set -e
          echo "== Verifying exported IPA =="
          IPA_PATH=$(find "$CM_BUILD_DIR" -name "*.ipa" -type f -print 2>/dev/null | head -n1 || true)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa found after flutter build ipa."
            echo "Contents of APP/build/ios/ipa:"
            ls -la APP/build/ios/ipa 2>&1 || true
            echo "Contents of APP/build/ios/archive:"
            ls -la APP/build/ios/archive 2>&1 || true
            exit 1
          fi
          echo "IPA OK at: $IPA_PATH"
          echo "IPA size: $(du -h "$IPA_PATH" | cut -f1)"
    artifacts:
      # Primary (relative to clone dir): matches IPA under the Flutter project root
      - APP/build/ios/ipa/*.ipa
      # Fallback (relative to working directory APP)
      - build/ios/ipa/*.ipa
      # Absolute fallback
      - $CM_BUILD_DIR/APP/build/ios/ipa/*.ipa
      # Universal recursive fallback (should not be needed once the above match)
      - "**/*.ipa"
      - APP/build/ios/archive/*.xcarchive
      - build/ios/archive/*.xcarchive
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false

  ios-simulator:
    name: iOS Simulator (no Apple account needed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: APP
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          set -e
          flutter pub get

      - name: Build for the iOS Simulator
        script: |
          set -e
          flutter build ios --simulator --debug
    artifacts:
      - APP/build/ios/iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/Runner.app
