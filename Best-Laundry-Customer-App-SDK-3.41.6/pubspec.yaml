name: laundry_customer
description: "Elite Cleaning - premium dry cleaning and laundry services."

publish_to: "none"

version: 1.0.5+8

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  #Design
  flutter_screenutil: ^5.5.3+2
  #State management
  flutter_riverpod: ^2.4.2
  #Api Handling
  dio: ^5.3.3
  pretty_dio_logger: ^1.2.0-beta-1
  freezed_annotation: ^2.0.3
  #Form
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.0.0
  #Local DataBase
  hive_flutter: ^1.1.0
  #Routing
  page_transition: ^2.2.1
  #Misc
  flutter_svg: ^2.0.7
  confetti: ^0.8.0
  intl: ^0.20.2
  flutter_easyloading: ^3.0.5
  carousel_slider: ^5.0.0
  logger: ^2.0.2+1
  pin_code_fields: ^8.0.1
  animated_bottom_navigation_bar: ^1.0.0
  expandable: ^5.0.1
  flutter_stripe: ^11.0.0
  flutter_rating_bar: ^4.0.1
  collection: ^1.16.0
  image_picker: ^1.0.4
  flutter_html: ^3.0.0-alpha.5
  table_calendar: ^3.0.6
  url_launcher: ^6.1.5
  upgrader: ^11.0.0
  # flutter_launch: ^0.3.0
  cached_network_image: ^3.2.3
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  # change_app_package_name: ^1.1.0
  socket_io_client: ^3.0.0
  permission_handler: ^11.0.0
  flutter_inappwebview: ^6.1.5
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^2.0.3+1
  lint: ^2.1.2
  flutter_launcher_icons: ^0.14.1
  rename: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
flutter_intl:
  enabled: true
